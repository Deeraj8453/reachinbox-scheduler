name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Type Check
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Run Unit Tests
      run: |
        cd frontend
        npm run test

    - name: Build Frontend
      run: |
        cd frontend
        npm run build
